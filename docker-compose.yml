# 薄荷商城统一编排文件：中间件 + 12 个应用服务。
# 用法：
#   cp .env.example .env        # 按需修改密钥
#   docker compose up -d --build
# 仅 Gateway(8080) 对外暴露，业务服务只在内部网络通过服务名互访。
#
# 中间件定义来自 scripts/docker-compose.yaml（所有环境通用版），与其冲突时以该文件为准。

# 应用服务通用环境变量（共享 YAML 锚点），主机名/端口与下方中间件服务名保持一致
x-app-env: &app-env
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  NACOS_HOST: nacos
  NACOS_PORT: 8848
  ROCKETMQ_NAMESRV_ADDR: rocketmq-namesrv:9876
  SEATA_HOST: seata
  SEATA_PORT: 8091
  ES_HOST: elasticsearch
  ES_PORT: 9200
  MINIO_ENDPOINT: http://minio:9000
  # 客户端可达的 MinIO 地址（浏览器预签名 URL 使用）
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  # 安全密钥统一从 .env 注入并给默认值；生产必须覆盖
  MINIMALL_JWT_SECRET: ${MINIMALL_JWT_SECRET:-minimall-dev-jwt-secret-key-change-me-0123456789}
  MINIMALL_INTERNAL_TOKEN: ${MINIMALL_INTERNAL_TOKEN:-minimall-internal-token-dev}
  MINIMALL_SECURITY_AES_KEY: ${MINIMALL_SECURITY_AES_KEY:-QUJDREVGR0hJSktMTU5PUFFSU1RVVldaWDEyMzQ1Ng==}

services:
  # ==================== 中间件（scripts/docker-compose.yaml 为准） ====================
  mysql:
    image: mysql:8.0
    container_name: mini-mail-system-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-minimall_db}
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./nacos/init/nacos-mysql.sql:/docker-entrypoint-initdb.d/nacos-mysql.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "mini-mail-system-mysql", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: mini-mail-system-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-redis123}", "--maxmemory", "256mb"]
    volumes:
      - ./redis/data:/data
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mini-mail-system-nacos
    restart: unless-stopped
    ports:
      - "9848:9848"
      - "9849:9849"
      - "8848:8848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: ${NACOS_DB:-nacos}
      MYSQL_SERVICE_USER: ${NACOS_DB_USER:-root}
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-root123}}
      MYSQL_SERVICE_DB_PARAM: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-nacos}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos}
    volumes:
      - ./nacos/logs:/home/nacos/logs
      - ./nacos/data:/home/nacos/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: mini-mail-system-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m
    command: sh mqnamesrv
    volumes:
      - ./rocketmq/namesrv/logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/mini-mail-system-rocketmq-namesrv/9876' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: mini-mail-system-rocketmq-broker
    # 以 root 启动：entrypoint.sh 先修 bind mount 目录属主，再渲染 broker.conf。
    # apache/rocketmq:5.1.4 镜像内没有 gosu/su-exec，broker 最终仍以 root 运行。
    user: "0"
    restart: unless-stopped
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms512m -Xmx512m
      BROKER_IP1: ${ROCKETMQ_BROKER_IP:-127.0.0.1}
    entrypoint: ["/bin/sh", "/home/rocketmq/bin/entrypoint.sh"]
    command: ["sh", "mqbroker", "-c", "/tmp/broker.conf"]
    volumes:
      - ./rocketmq/broker/logs:/home/rocketmq/logs
      - ./rocketmq/broker/store:/home/rocketmq/store
      - ./rocketmq/broker/conf/broker.conf.tmpl:/home/rocketmq/conf/broker.conf.tmpl:ro
      - ./rocketmq/broker/entrypoint.sh:/home/rocketmq/bin/entrypoint.sh:ro
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/mini-mail-system-rocketmq-broker/10911' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: mini-mail-system-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_plugins:/usr/share/elasticsearch/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    container_name: mini-mail-system-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio/data:/data
      - ./minio/config:/root/.minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://mini-mail-system-minio:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  seata:
    image: seataio/seata-server:2.0.0
    container_name: mini-mail-system-seata
    restart: unless-stopped
    ports:
      - "7091:7091"   # seata console
      - "8091:8091"   # seata server (RPC)
    environment:
      # seata-server 自身的 IP / 端口。容器内 127.0.0.1 即可，应用从 nacos 发现服务地址
      SEATA_IP: 127.0.0.1
      SEATA_PORT: "8091"
      TZ: Asia/Shanghai
    volumes:
      # 把完整 application.yml 挂进去，避开不同镜像版本 env 变量命名差异
      # nacos 地址 / namespace / group / 账号 通过文件内 ${} 占位符读 .env
      - ./seata/conf/application.yml:/seata-server/conf/application.yml:ro
      - ./seata/conf/logback.xml:/seata-server/conf/logback.xml:ro
      # seata 默认把日志和 file-mode 数据写到 /root/logs/seata；同名卷可按需改路径
      - seata-data:/seata-data
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7091/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - app-network

  # ==================== 应用服务 ====================
  # 业务服务仅在内部网络，通过 Nacos 服务名互访，不做端口映射。
  gateway:
    build:
      context: .
      dockerfile: minimall-gateway/Dockerfile
    container_name: minimall-gateway
    restart: unless-stopped
    depends_on: [nacos, redis]
    environment:
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIMALL_JWT_SECRET: ${MINIMALL_JWT_SECRET:-minimall-dev-jwt-secret-key-change-me-0123456789}
      MINIMALL_INTERNAL_TOKEN: ${MINIMALL_INTERNAL_TOKEN:-minimall-internal-token-dev}
    ports: ["8080:8080"]
    networks:
      - app-network

  auth:
    build:
      context: .
      dockerfile: minimall-auth-service/Dockerfile
    container_name: minimall-auth
    restart: unless-stopped
    depends_on: [nacos, mysql, redis]
    environment: *app-env
    networks:
      - app-network

  user:
    build:
      context: .
      dockerfile: minimall-user-service/Dockerfile
    container_name: minimall-user
    restart: unless-stopped
    depends_on: [nacos, mysql, redis]
    environment: *app-env
    networks:
      - app-network

  merchant:
    build:
      context: .
      dockerfile: minimall-merchant-service/Dockerfile
    container_name: minimall-merchant
    restart: unless-stopped
    depends_on: [nacos, mysql, redis]
    environment: *app-env
    networks:
      - app-network

  goods:
    build:
      context: .
      dockerfile: minimall-goods-service/Dockerfile
    container_name: minimall-goods
    restart: unless-stopped
    depends_on: [nacos, mysql, redis, elasticsearch, minio]
    environment: *app-env
    networks:
      - app-network

  cart:
    build:
      context: .
      dockerfile: minimall-cart-service/Dockerfile
    container_name: minimall-cart
    restart: unless-stopped
    depends_on: [nacos, mysql, redis]
    environment: *app-env
    networks:
      - app-network

  order:
    build:
      context: .
      dockerfile: minimall-order-service/Dockerfile
    container_name: minimall-order
    restart: unless-stopped
    depends_on: [nacos, mysql, redis, seata, rocketmq-namesrv]
    environment: *app-env
    networks:
      - app-network

  pay:
    build:
      context: .
      dockerfile: minimall-pay-service/Dockerfile
    container_name: minimall-pay
    restart: unless-stopped
    depends_on: [nacos, mysql, redis]
    environment: *app-env
    networks:
      - app-network

  stock:
    build:
      context: .
      dockerfile: minimall-stock-service/Dockerfile
    container_name: minimall-stock
    restart: unless-stopped
    depends_on: [nacos, mysql, redis]
    environment: *app-env
    networks:
      - app-network

  notify:
    build:
      context: .
      dockerfile: minimall-notify-service/Dockerfile
    container_name: minimall-notify
    restart: unless-stopped
    depends_on: [nacos, mysql, redis, rocketmq-namesrv]
    environment: *app-env
    networks:
      - app-network

  platform:
    build:
      context: .
      dockerfile: minimall-platform-service/Dockerfile
    container_name: minimall-platform
    restart: unless-stopped
    depends_on: [nacos, mysql, redis]
    environment: *app-env
    networks:
      - app-network

  id:
    build:
      context: .
      dockerfile: minimall-id-service/Dockerfile
    container_name: minimall-id
    restart: unless-stopped
    depends_on: [nacos, mysql]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      NACOS_HOST: nacos
      NACOS_PORT: 8848
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

# 命名卷（中间件数据当前用 bind mount；此处仅 ES / seata 需要命名卷）
volumes:
  elasticsearch_data:
  elasticsearch_plugins:
  seata-data: