version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: minimall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: id_db
    ports: ["3306:3306"]
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: minimall-nacos
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports: ["8848:8848"]

  redis:
    image: redis:7.2.4
    container_name: minimall-redis
    ports: ["6379:6379"]

volumes:
  mysql-data: