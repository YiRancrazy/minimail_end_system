server:
  port: 8201
spring:
  application:
    name: minimall-auth-service
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/auth_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0

minimall:
  jwt:
    secret: dev-secret-change-me-32bytes-min!!
    ttl-seconds: 900
    refresh-ttl-seconds: 604800
  knife4j:
    enable: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
