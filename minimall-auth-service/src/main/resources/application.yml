server:
  port: 8201
feign:
  sentinel:
    enabled: true
spring:
  application:
    name: minimall-auth-service
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    inetutils:
      # Register a routable address (docker bridge or LAN); the default
      # first-non-loopback pick can be 169.254.x.x, which the gateway cannot reach.
      preferred-networks: ${MINIMALL_PREFERRED_NETWORKS:172.,192.168.,10.}
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 3000
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/minimall_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD:root}}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

minimall:
  jwt:
    secret: ${MINIMALL_JWT_SECRET}
    ttl-seconds: 900
    refresh-ttl-seconds: 604800
  knife4j:
    enable: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
