server:
  port: 8080
spring:
  application:
    name: minimall-gateway
  profiles:
    active: dev
  main:
    # Force reactive container even though gateway depends on several
    # reactive starters. Without this hint, the deduplication logic in
    # WebApplicationType.deduceFromClasspath sometimes picks NONE when both
    # spring-web and spring-webflux are on the classpath transitively.
    web-application-type: reactive
  config:
    # Nacos config is optional; the gateway only needs discovery for routing.
    # Gateway does not depend on minimall-common (to keep the reactive stack
    # clean), so DotenvConfig never runs here; import the repo .env directly
    # instead. Relative paths resolve against the JVM working dir, which varies
    # between repo root (mvnw) and the module dir (IDE / java -jar).
    import: "optional:nacos:minimall-gateway-dev.yaml,optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"
  cloud:
    nacos:
      discovery:
        # Use the dev host (Nacos + Redis + MySQL all live on localdev);
        # 127.0.0.1 would point at this machine's empty ports.
        server-addr: ${NACOS_HOST:localdev}:${NACOS_PORT:8848}
      config:
        server-addr: ${NACOS_HOST:localdev}:${NACOS_PORT:8848}
        file-extension: yaml
  data:
    redis:
      host: ${REDIS_HOST:localdev}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dazhutizi}
      database: 0

minimall:
  jwt:
    secret: ${MINIMALL_JWT_SECRET}
  security:
    internal-token: ${MINIMALL_INTERNAL_TOKEN}