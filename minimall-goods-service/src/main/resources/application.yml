server:
  port: 8204
feign:
  sentinel:
    enabled: true
spring:
  application:
    name: minimall-goods-service
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    inetutils:
      # Register a routable address (docker bridge or LAN); the default
      # first-non-loopback pick can be 169.254.x.x, which the gateway cannot reach.
      preferred-networks: ${MINIMALL_PREFERRED_NETWORKS:172.,192.168.,10.}
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 3000
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/minimall_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD:root}}
  knife4j:
    enable: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  elasticsearch:
    uris: ${ES_URIS:http://127.0.0.1:9200}
minimall:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:mall-files}
