server:
  port: 8211
spring:
  application:
    name: minimall-id-service
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    inetutils:
      # 注册一个可路由地址（Docker bridge 或局域网）；默认选择
      # 第一个非回环地址时可能得到 169.254.x.x，其他节点无法访问。
      preferred-networks: ${MINIMALL_PREFERRED_NETWORKS:172.,192.168.,10.}
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
  knife4j:
    enable: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
