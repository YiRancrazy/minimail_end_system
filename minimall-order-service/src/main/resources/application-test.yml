spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:order_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
  cloud:
    nacos:
      discovery:
        enabled: false
    openfeign:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.cloud.openfeign.FeignAutoConfiguration