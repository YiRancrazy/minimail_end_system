server:
  port: 8206
spring:
  application:
    name: minimall-order-service
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/minimall_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  knife4j:
    enable: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
seata:
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: ${SEATA_HOST:127.0.0.1}:${SEATA_PORT:8091}
  registry:
    type: file
  config:
    type: file
minimall:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:mall-files}
  eventbus:
    rocketmq:
      enabled: false
      namesrv-addr: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
      topic: minimall-events
  schedule:
    enabled: false
    scan-expired-ms: 60000
    scan-auto-confirm-ms: 3600000
  xxl-job:
    enabled: false
    admin-addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8080/xxl-job-admin}
    access-token: ${XXL_JOB_TOKEN:}
    app-name: minimall-order-service
    port: ${XXL_JOB_PORT:9999}
    log-path: ${XXL_JOB_LOG:/data/applogs/xxl-job/order}
