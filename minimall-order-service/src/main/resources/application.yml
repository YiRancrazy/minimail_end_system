server:
  port: 8206
spring:
  application:
    name: minimall-order-service
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/order_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  knife4j:
    enable: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
minimall:
  eventbus:
    rocketmq:
      enabled: false
      namesrv-addr: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
      topic: minimall-events
  schedule:
    enabled: false
    scan-expired-ms: 60000
    scan-auto-confirm-ms: 3600000
