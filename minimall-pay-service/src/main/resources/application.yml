server:
  port: 8207
feign:
  sentinel:
    enabled: true
spring:
  application:
    name: minimall-pay-service
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    inetutils:
      # Register a routable address (docker bridge or LAN); the default
      # first-non-loopback pick can be 169.254.x.x, which the gateway cannot reach.
      preferred-networks: ${MINIMALL_PREFERRED_NETWORKS:172.,192.168.,10.}
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 3000
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/minimall_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD:root}}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  knife4j:
    enable: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
minimall:
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    # 沙箱需配置公网可达的 HTTPS 回调地址（如 ngrok 隧道转发到本机网关 8080 端口），域名为占位符时沙箱回调无法送达
    notify-url: ${ALIPAY_NOTIFY_URL:https://mall.example.com/api/v1/user/pay/callback/alipay}
    return-url: ${ALIPAY_RETURN_URL:https://mall.example.com/pay/result}
  schedule:
    enabled: ${MINIMALL_SCHEDULE_ENABLED:true}
    scan-callback-ms: 30000
    scan-refund-ms: 30000
logging:
  level:
    root: INFO
    com.yirancrazy.minimall.pay: trace
seata:
  enabled: true
  application-id: minimall-pay-service
  tx-service-group: default_tx_group
  enable-auto-data-source-proxy: true
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: ${SEATA_HOST:127.0.0.1}:${SEATA_PORT:8091}
  registry:
    type: file
  config:
    type: file
