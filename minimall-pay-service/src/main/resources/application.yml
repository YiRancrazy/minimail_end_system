server:
  port: 8207
spring:
  application:
    name: minimall-pay-service
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/minimall_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  knife4j:
    enable: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
minimall:
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    # 沙箱需配置公网可达的 HTTPS 回调地址（如 ngrok 隧道转发到本机网关 8080 端口），域名为占位符时沙箱回调无法送达
    notify-url: ${ALIPAY_NOTIFY_URL:https://mall.example.com/api/v1/user/pay/callback/alipay}
    return-url: ${ALIPAY_RETURN_URL:https://mall.example.com/pay/result}
  schedule:
    enabled: false
    scan-callback-ms: 30000
logging:
  level:
    root: INFO
    com.yirancrazy.minimall.pay: trace
