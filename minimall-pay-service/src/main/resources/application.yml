server:
  port: 8207
spring:
  application:
    name: minimall-pay-service
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/pay_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  knife4j:
    enable: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
minimall:
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway-url: https://openapi.alipay.com/gateway.do
    notify-url: ${ALIPAY_NOTIFY_URL:https://mall.example.com/api/v1/pay/callback/alipay}
    return-url: ${ALIPAY_RETURN_URL:https://mall.example.com/pay/result}
  schedule:
    enabled: false
    scan-callback-ms: 30000
