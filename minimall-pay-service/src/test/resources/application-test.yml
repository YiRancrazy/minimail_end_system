spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:pay_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  cloud:
    nacos:
      discovery:
        enabled: false
    loadbalancer:
      ribbon:
        enabled: false
  main:
    allow-bean-definition-overriding: true

minimall:
  alipay:
    app-id: test
    private-key: test
    alipay-public-key: test
    gateway-url: https://openapi.alipay.com/gateway.do
    notify-url: https://mall.example.com/api/v1/pay/callback/alipay
    return-url: https://mall.example.com/pay/result
  schedule:
    enabled: false
    scan-callback-ms: 30000
