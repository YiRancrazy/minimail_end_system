server:
  port: 8210
feign:
  sentinel:
    enabled: true
spring:
  application:
    name: minimall-platform-service
  profiles:
    active: dev
  cloud:
    inetutils:
      # Register a routable address (docker bridge or LAN); the default
      # first-non-loopback pick can be 169.254.x.x, which the gateway cannot reach.
      preferred-networks: ${MINIMALL_PREFERRED_NETWORKS:172.,192.168.,10.}
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
minimall:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:mall-files}
